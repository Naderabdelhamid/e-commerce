<div
  class="group bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 hover:border-emerald-500/40 dark:hover:border-emerald-500/50 shadow-xs hover:shadow-xl hover:shadow-emerald-600/5 transition-all duration-300 flex flex-col h-full overflow-hidden relative"
>
  <!-- Wishlist Floating Button -->
  <button
    type="button"
    (click)="toggleWishlist($event)"
    [disabled]="isTogglingWishlist"
    [attr.aria-label]="isWishlisted() ? 'Remove from wishlist' : 'Add to wishlist'"
    class="absolute top-3 right-3 rtl:right-auto rtl:left-3 z-10 w-9 h-9 rounded-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-xs border border-slate-100 dark:border-slate-700 shadow-sm flex items-center justify-center hover:scale-110 active:scale-95 transition-all cursor-pointer"
  >
    <i
      [class]="
        isWishlisted()
          ? 'fas fa-heart text-rose-500 text-sm'
          : 'far fa-heart text-slate-400 dark:text-slate-500 group-hover:text-rose-500 text-sm transition-colors'
      "
    ></i>
  </button>

  <!-- Product Clickable Area (Navigates to details) -->
  <a
    [routerLink]="['/details', product.slug, product._id]"
    class="block flex-1 p-4 pb-0 cursor-pointer"
  >
    <!-- Product Image -->
    <div class="aspect-square w-full rounded-2xl bg-slate-50/80 dark:bg-slate-800/60 overflow-hidden relative mb-4 p-2 flex items-center justify-center">
      <img
        [src]="product.imageCover"
        [alt]="product.title"
        class="max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-500"
        loading="lazy"
      />
    </div>

    <!-- Category & Ratings -->
    <div class="flex items-center justify-between gap-2 mb-1.5">
      <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 truncate">
        {{ product.category.name }}
      </span>

      <div class="flex items-center gap-1 text-xs font-semibold text-slate-700 dark:text-slate-300 shrink-0">
        <i class="fas fa-star text-amber-400 text-[11px]"></i>
        <span>{{ product.ratingsAverage || 4.5 }}</span>
      </div>
    </div>

    <!-- Title -->
    <h3
      class="text-sm font-bold text-slate-800 dark:text-slate-100 line-clamp-1 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors mb-2"
      [title]="product.title"
    >
      {{ product.title }}
    </h3>

    <!-- Price -->
    <div class="flex items-baseline gap-1.5 mb-4">
      <span class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white">
        {{ product.price }}
      </span>
      <span class="text-xs font-bold text-slate-500 dark:text-slate-400">{{ 'cardEgp' | trans }}</span>
    </div>
  </a>

  <!-- Add to Cart Footer Button -->
  <div class="p-4 pt-0 mt-auto">
    <button
      type="button"
      (click)="addProductItemToCart(product._id)"
      [disabled]="isAdding"
      class="w-full py-2.5 px-4 rounded-xl font-semibold text-xs text-white bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 shadow-xs shadow-emerald-600/20 cursor-pointer disabled:opacity-50"
    >
      @if (isAdding) {
        <i class="fas fa-spinner fa-spin text-xs"></i>
        <span>{{ 'cardAdding' | trans }}</span>
      } @else {
        <i class="fas fa-cart-plus text-xs"></i>
        <span>{{ 'cardAddToCart' | trans }}</span>
      }
    </button>
  </div>
</div>
