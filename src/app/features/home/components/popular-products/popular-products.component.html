<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="flex items-end justify-between mb-8 pb-2 border-b border-slate-100">
    <div>
      <span class="text-xs font-bold uppercase tracking-wider text-emerald-600">Handpicked For You</span>
      <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mt-1">Popular Products</h2>
    </div>
    <a routerLink="/products" class="text-xs sm:text-sm font-semibold text-emerald-600 hover:text-emerald-700 inline-flex items-center gap-1 group transition-colors">
      Explore All Products
      <i class="fas fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
    </a>
  </div>

  @if (isLoading) {
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5">
      @for (n of [1,2,3,4,5,6]; track n) {
        <div class="bg-white rounded-3xl p-4 border border-slate-100 animate-pulse">
          <div class="aspect-square bg-slate-200 rounded-2xl mb-3"></div>
          <div class="h-3 bg-slate-200 rounded w-1/3 mb-2"></div>
          <div class="h-4 bg-slate-200 rounded w-3/4 mb-3"></div>
          <div class="h-8 bg-slate-200 rounded-xl"></div>
        </div>
      }
    </div>
  } @else {
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5">
      @for (product of productsList.slice(0, 12); track product._id) {
        <app-card [product]="product"></app-card>
      }
    </div>
  }
</section>
