<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex items-end justify-between mb-6 pb-2 border-b border-slate-100">
    <div>
      <span class="text-xs font-bold uppercase tracking-wider text-emerald-600">Explore Departments</span>
      <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mt-1">Shop Popular Categories</h2>
    </div>
    <a routerLink="/categories" class="text-xs sm:text-sm font-semibold text-emerald-600 hover:text-emerald-700 inline-flex items-center gap-1 group transition-colors">
      View All Categories
      <i class="fas fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
    </a>
  </div>

  <owl-carousel-o [options]="categoriesOptions">
    @for (category of categoriserList; track category._id) {
      <ng-template carouselSlide [id]="category._id">
        <a
          [routerLink]="['/products']"
          [queryParams]="{ category: category._id }"
          class="group block bg-white rounded-3xl p-4 border border-slate-200/80 hover:border-emerald-500/50 shadow-xs hover:shadow-lg transition-all duration-300 text-center"
        >
          <div class="w-full aspect-square rounded-2xl overflow-hidden bg-slate-50 mb-3 p-2 flex items-center justify-center">
            <img
              [src]="category.image"
              [alt]="category.name"
              class="max-h-full max-w-full object-cover rounded-xl group-hover:scale-105 transition-transform duration-300"
              loading="lazy"
            />
          </div>
          <h3 class="text-xs sm:text-sm font-bold text-slate-800 group-hover:text-emerald-700 transition-colors truncate">
            {{ category.name }}
          </h3>
        </a>
      </ng-template>
    }
  </owl-carousel-o>
</section>
